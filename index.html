<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>多元思维模型</title>
    <link rel="stylesheet" href="./assets/katex.min.css">
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb; --panel: #fff; --panel-strong: #eef4f8; --text: #171a1f;
        --muted: #667085; --line: #dce3ea; --accent: #0f766e; --accent-2: #b45309;
        --shadow: 0 12px 30px rgba(29, 41, 57, .08);
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #111418; --panel: #181d22; --panel-strong: #20272e; --text: #f3f5f7;
        --muted: #a8b0bb; --line: #2e3741; --accent: #5eead4; --accent-2: #fbbf24;
        --shadow: 0 12px 30px rgba(0, 0, 0, .28);
      }
      * { box-sizing: border-box; }
      html { scroll-padding-top: 22px; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.72;
      }
      button, input, textarea { font: inherit; }
      .app-shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 100vh; }
      .sidebar {
        position: sticky; top: 0; height: 100vh; overflow: auto; padding: 22px 18px;
        background: var(--panel); border-right: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .brand-mark {
        width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px;
        color: var(--accent); background: var(--panel-strong); font-weight: 850;
      }
      .brand h1 { margin: 0; font-size: 19px; line-height: 1.2; }
      .brand p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
      .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 8px; margin-bottom: 14px; }
      .search-box {
        min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 11px;
        border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--muted);
      }
      .search-box input {
        width: 100%; min-width: 0; height: 40px; border: 0; outline: 0; background: transparent; color: var(--text);
      }
      .icon-button {
        width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--bg); color: var(--text); cursor: pointer;
      }
      .progress-panel {
        padding: 13px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel-strong); margin-bottom: 14px;
      }
      .progress-panel div:first-child { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
      .progress-panel strong { color: var(--text); }
      .progress-bar { height: 7px; overflow: hidden; margin-top: 9px; border-radius: 999px; background: var(--line); }
      .progress-bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 180ms ease; }
      .toc-group { padding: 12px 0; border-top: 1px solid var(--line); }
      .toc-heading { display: flex; justify-content: space-between; margin: 0 4px 7px; font-weight: 750; }
      .toc-heading small { color: var(--muted); font-weight: 600; }
      .toc-link {
        display: grid; grid-template-columns: 32px minmax(0, 1fr) 18px; align-items: center; gap: 8px;
        min-height: 36px; padding: 7px 8px; border-radius: 8px; color: var(--muted);
        text-decoration: none; font-size: 14px;
      }
      .toc-link:hover, .toc-link.active { background: var(--panel-strong); color: var(--accent); }
      .day-chip { color: var(--accent-2); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 800; }
      .content { width: min(940px, 100%); margin: 0 auto; padding: 42px 32px 96px; }
      .hero { padding: 28px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
      .hero p { margin: 0 0 6px; color: var(--accent); font-weight: 800; font-size: 13px; }
      .hero h2 { margin: 0; font-size: 34px; line-height: 1.18; }
      .hero div { max-width: 720px; margin-top: 10px; color: var(--muted); }
      .lesson {
        padding: 26px 28px; margin: 18px 0; border: 1px solid var(--line);
        border-radius: 8px; background: var(--panel); box-shadow: var(--shadow);
      }
      .lesson-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
      .lesson-header p { margin: 0 0 5px; color: var(--accent); font-size: 12px; font-weight: 850; }
      .lesson h2 { margin: 0; font-size: 27px; line-height: 1.3; }
      .lesson h2 span { color: var(--muted); font-size: 18px; font-weight: 550; }
      .read-toggle { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); font-size: 13px; cursor: pointer; }
      .definition { margin: 20px 0 16px; padding: 14px 16px; border-radius: 8px; background: var(--panel-strong); }
      .section-grid { display: block; }
      .section-grid section {
        padding: 15px 0;
        border-top: 1px solid var(--line);
      }
      .section-grid section:first-child { border-top: 0; padding-top: 0; }
      .exercise {
        padding: 12px 14px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel-strong) 45%, transparent);
      }
      .lesson h3 { margin: 0 0 5px; font-size: 15px; }
      .lesson p { margin: 0; }
      .exercise { margin-top: 12px; }
      .exercise h3 {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .exercise h3 span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .exercise textarea {
        display: block; width: 100%; min-height: 56px; resize: vertical; margin-top: 10px;
        padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
      }
      .lesson-nav { display: flex; justify-content: space-between; align-items: center; min-height: 38px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
      .lesson-nav a { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 14px; }
      .empty { padding: 32px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--panel); }
      .lesson-body { overflow-wrap: anywhere; }
      .lesson-body h1 { font-size: 24px; margin: 28px 0 12px; }
      .lesson-body h2 { font-size: 21px; margin: 28px 0 12px; }
      .lesson-body h3 { font-size: 17px; margin: 20px 0 8px; }
      .lesson-body p { margin: 12px 0; }
      .lesson-body blockquote { margin: 18px 0; padding: 2px 18px; border-left: 3px solid var(--accent); color: var(--muted); }
      .lesson-body a, .hero a, .original-source { color: var(--accent); }
      .lesson-body ul, .lesson-body ol { padding-left: 24px; }
      .lesson-body table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 14px; }
      .lesson-body th, .lesson-body td { padding: 9px 12px; border: 1px solid var(--line); min-width: 110px; }
      .lesson-body th { background: var(--panel-strong); }
      .lesson-body pre { overflow-x: auto; padding: 14px; background: var(--panel-strong); border-radius: 8px; }
      .lesson-body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
      .lesson-body .katex { font-size: 1.05em; }
      .lesson-body svg { display: block; max-width: 100%; height: auto; margin: 12px auto; color: var(--text); }
      .source-box { margin: 14px 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; }
      .source-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; }
      .source-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; }
      .source-text p { margin: 5px 0; }
      .source-caption, .source-note, .original-source { color: var(--muted); font-size: 13px; }
      .source-answer { margin: 16px 0; padding: 12px 16px; background: var(--panel-strong); border-radius: 8px; }
      .source-answer summary { cursor: pointer; color: var(--accent); font-weight: 700; }
      .source-reference { color: var(--muted); font-size: 11px; }
      .source-links { margin-top: 28px; border-top: 1px solid var(--line); }
      .original-source { display: inline-block; margin-top: 12px; }
      #directory > summary { display: none; }
      @media (max-width: 860px) {
        #directory > summary { display: list-item; cursor: pointer; font-weight: 700; padding: 10px 4px; color: var(--accent); }

        .app-shell { display: block; }
        .sidebar { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
        .content { padding: 24px 14px 72px; }
        .hero h2 { font-size: 29px; }
        .lesson { padding: 22px 18px; }
        .toc-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 8px; }
        .toc-heading { grid-column: 1 / -1; }
      }
      @media (max-width: 520px) {
        .toc-group { grid-template-columns: 1fr; }
        .lesson-header { display: block; }
        .read-toggle { margin-top: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <h1>多元思维模型</h1>
            <p id="subtitle">每日自动更新</p>
          </div>
        </div>
        <div class="toolbar">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="search" placeholder="搜索模型、学科或关键词">
          </label>
          <button id="theme" class="icon-button" aria-label="切换深色模式">◐</button>
        </div>
        <div class="progress-panel">
          <div><span>阅读进度</span><strong id="progress-text">0 / 0</strong></div>
          <div class="progress-bar"><span id="progress-bar"></span></div>
        </div>
        <details id="directory" open><summary>课程目录 · <span id="directory-count">70</span> 课</summary><nav id="toc" class="toc" aria-label="课程目录"></nav></details>
      </aside>
      <main class="content">
        <section class="hero">
          <p>每日一课</p>
          <h2>多学科思维模型学习地图</h2>
          <div id="site-intro">历史课程已恢复。你的已读状态、阅读进度和练习笔记保存在当前浏览器。</div><p><a id="latest-lesson" href="#day-70">阅读最新一课 →</a></p>
        </section>
        <div id="lessons" class="lesson-list"></div>
      </main>
    </div>
    <script>
      const state = { courses: [], query: "", read: load("mental-model-read", {}), notes: load("mental-model-notes", {}) };
      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (value = "") => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      function load(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
      }
      function save(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
      function grouped(courses) {
        return courses.reduce((map, course) => {
          const key = course.module || course.discipline || "未分类";
          map[key] ||= [];
          map[key].push(course);
          return map;
        }, {});
      }
      function searchable(course) {
        return [
          course.day, course.module, course.chineseName, course.englishName, course.discipline,
          course.definition, course.intuition, course.case, course.application, course.connections,
          course.pitfall, course.exercise, course.searchText
        ].filter(Boolean).join(" ").toLowerCase();
      }
      function filteredCourses() {
        const q = state.query.trim().toLowerCase();
        return state.courses.filter((course) => searchable(course).includes(q));
      }
      function render() {
        const courses = filteredCourses();
        $("#subtitle").textContent = `Day 1–${state.courses.length} · 多元思维模型`;
        $("#directory-count").textContent = state.courses.length;
        $("#latest-lesson").href = `#day-${state.courses.at(-1).day}`;
        $("#site-intro").textContent = state.courses.some(c => c.source === "generated")
          ? "每天中午更新一课。你的已读状态、阅读进度和练习笔记保存在当前浏览器。"
          : "Day 1–70 历史课程已恢复，每日更新准备中。你的已读状态、阅读进度和练习笔记保存在当前浏览器。";
        renderProgress();
        $("#toc").innerHTML = Object.entries(grouped(courses)).map(([module, items]) => `
          <section class="toc-group">
            <div class="toc-heading"><span>${escapeHtml(module)}</span><small>${items.length}</small></div>
            ${items.map((course) => `
              <a class="toc-link" href="#day-${course.day}" data-day="${course.day}">
                <span class="day-chip">${String(course.day).padStart(2, "0")}</span>
                <span>${escapeHtml(course.chineseName)}</span>
                <span data-read-mark="${course.day}">${state.read[course.day] ? "✓" : ""}</span>
              </a>
            `).join("")}
          </section>
        `).join("");
        $("#lessons").innerHTML = courses.length ? courses.map(renderLesson).join("") : '<div class="empty">没有匹配的课程。</div>';
        bindLessonInputs();
        observeActive();
      }
      function renderLesson(course) {
        const previous = state.courses.find((item) => item.day === course.day - 1);
        const next = state.courses.find((item) => item.day === course.day + 1);
        return `
          <article class="lesson" id="day-${course.day}" data-lesson data-day="${course.day}">
            <header class="lesson-header">
              <div>
                <p>DAY ${String(course.day).padStart(2, "0")} · ${escapeHtml(course.discipline || course.module)}</p>
                <h2>${escapeHtml(course.chineseName)} <span>${escapeHtml(course.englishName)}</span></h2>
              </div>
              <label class="read-toggle"><input type="checkbox" data-read="${course.day}" ${state.read[course.day] ? "checked" : ""}><span>已读</span></label>
            </header>
            <div class="lesson-body">${course.bodyHtml}</div>
            <section class="exercise">
              <h3>我的练习笔记 <span>Optional</span></h3>
              <textarea data-note="${course.day}" rows="2" placeholder="想写再写，留一个想法就好">${escapeHtml(state.notes[course.day] || "")}</textarea>
            </section>
            <a class="original-source" href="./${escapeHtml(course.path)}" target="_blank" rel="noopener">查看课程原文</a>
            <nav class="lesson-nav">
              ${previous ? `<a href="#day-${previous.day}">‹ Day ${previous.day}</a>` : "<span></span>"}
              ${next ? `<a href="#day-${next.day}">Day ${next.day} ›</a>` : "<span></span>"}
            </nav>
          </article>
        `;
      }
      function renderProgress() {
        const total = state.courses.length;
        const done = state.courses.filter((course) => state.read[course.day]).length;
        $("#progress-text").textContent = `${done} / ${total}`;
        $("#progress-bar").style.width = total ? `${Math.round(done / total * 100)}%` : "0";
      }
      function bindLessonInputs() {
        document.querySelectorAll("[data-read]").forEach((box) => {
          box.addEventListener("change", () => {
            state.read[box.dataset.read] = box.checked;
            save("mental-model-read", state.read);
            renderProgress();
            const mark = document.querySelector(`[data-read-mark="${box.dataset.read}"]`);
            if (mark) mark.textContent = box.checked ? "✓" : "";
          });
        });
        document.querySelectorAll("[data-note]").forEach((textarea) => {
          textarea.addEventListener("input", () => {
            state.notes[textarea.dataset.note] = textarea.value;
            save("mental-model-notes", state.notes);
          });
        });
      }
      let observer;
      function observeActive() {
        if (observer) observer.disconnect();
        observer = new IntersectionObserver((entries) => {
          const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (!visible) return;
          document.querySelectorAll(".toc-link").forEach((link) => link.classList.toggle("active", link.dataset.day === visible.target.dataset.day));
        }, { threshold: [0.35, 0.6], rootMargin: "-12% 0px -45% 0px" });
        document.querySelectorAll("[data-lesson]").forEach((node) => observer.observe(node));
      }
      if (matchMedia("(max-width: 860px)").matches) $("#directory").open = false;
      document.addEventListener("click", (event) => {
        const link = event.target.closest('a[href^="#day-"]');
        if (!link) return;
        const id = link.getAttribute("href");
        if (state.query) { state.query = ""; $("#search").value = ""; render(); }
        if (matchMedia("(max-width: 860px)").matches) $("#directory").open = false;
        event.preventDefault(); history.replaceState(null, "", id);
        document.querySelector(id)?.scrollIntoView({block: "start"});
      });
      $("#search").addEventListener("input", (event) => { state.query = event.target.value; render(); });
      $("#theme").addEventListener("click", () => {
        const dark = document.documentElement.dataset.theme !== "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        save("mental-model-dark", dark);
      });
      document.documentElement.dataset.theme = load("mental-model-dark", false) ? "dark" : "light";
      fetch("./data/courses.json")
        .then((response) => { if (!response.ok) throw new Error("Data unavailable"); return response.json(); })
        .then((courses) => {
          state.courses = courses.sort((a, b) => a.day - b.day);
          render();
          if (/^#day-\d+$/.test(location.hash)) requestAnimationFrame(() => document.querySelector(location.hash)?.scrollIntoView());
        })
        .catch(() => { $("#lessons").innerHTML = '<div class="empty">课程数据加载失败，请稍后刷新。</div>'; });
    </script>
  </body>
</html>
